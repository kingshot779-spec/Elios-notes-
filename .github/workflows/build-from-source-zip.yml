name: Build ELIOS NOTES APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ELIOS_NOTES_v82_phaseB_source.zip"
      - ".github/workflows/build-from-source-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract and build project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/ELIOS_NOTES_v82_phaseB_source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Phase B ZIP file was not found in repository root."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x ./gradlew

          ./gradlew --no-daemon \
            lintDebug \
            testDebugUnitTest \
            assembleDebug \
            --stacktrace

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/ELIOS_NOTES-debug.apk"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS-NOTES-debug-APK
          path: output/ELIOS_NOTES-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS-NOTES-build-reports
          path: |
            extracted/**/build/reports/**
            extracted/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
