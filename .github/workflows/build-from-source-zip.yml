name: Build ELIOS NOTES APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ELIOS_NOTES_v82_phaseB_source.zip"
      - ".github/workflows/build-from-source-zip.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept licenses and install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          # Avoid a harmless SIGPIPE from the yes command
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          # Install required Android packages
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Phase B ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/ELIOS_NOTES_v82_phaseB_source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Phase B ZIP not found in repository root."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" \
            -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      - name: Build and test ELIOS NOTES
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon \
            lintDebug \
            testDebugUnitTest \
            assembleDebug \
            --stacktrace

      - name: Locate and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/output/ELIOS_NOTES-debug.apk"

          echo "APK prepared successfully."

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS-NOTES-debug-APK
          path: output/ELIOS_NOTES-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELIOS-NOTES-build-reports
          path: |
            extracted/**/build/reports/**
            extracted/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
